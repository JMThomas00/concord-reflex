# Tests on every push. Releases are built and signed on the publisher's
# computer (see README: the publisher key never goes to CI).
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: GOOS=wasip1 GOARCH=wasm go build -o /dev/null ./clientcode
